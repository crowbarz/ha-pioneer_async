send_command:
  target:
    entity:
      integration: pioneer_async
      domain: media_player
  fields:
    command:
      required: true
      example: "PO"
      selector:
        text:
    prefix:
      selector:
        text:
    suffix:
      selector:
        text:
    args:
      selector:
        object:
    wait_for_response:
      selector:
        boolean:

set_amp_settings:
  target:
    entity:
      integration: pioneer_async
      domain: media_player
  fields:
    speaker_mode:
      example: "off"
      selector:
        select:
          translation_key: amp_speaker_mode
          options:
            - "off"
            - "a"
            - "b"
            - "a_b"
    hdmi_out:
      example: "all"
      selector:
        select:
          translation_key: amp_hdmi_out
          options:
            - "all"
            - "hdmi_1"
            - "hdmi_2"
    hdmi3_out:
      selector:
        boolean:
    hdmi_audio:
      example: "amp"
      selector:
        select:
          translation_key: amp_hdmi_audio
          options:
            - "amp"
            - "passthrough"
    pqls:
      example: "off"
      selector:
        select:
          translation_key: amp_pqls
          options:
            - "off"
            - "auto"
    dimmer:
      example: "brightest"
      selector:
        select:
          translation_key: amp_dimmer
          options:
            - "brightest"
            - "bright"
            - "dark"
            - "off"
    sleep_time:
      example: 0
      selector:
        number:
          min: 0
          max: 90
          step: 30
          unit_of_measurement: min
    mode:
      example: "amp on"
      selector:
        select:
          translation_key: amp_mode
          options:
            - "amp_on"
            - "amp_front_off"
            - "amp_front_center_off"
            - "amp_off"
    panel_lock:
      example: "off"
      selector:
        select:
          translation_key: amp_panel_lock
          options:
            - "off"
            - "panel_only"
            - "panel_volume"
    remote_lock:
      selector:
        boolean:

set_video_settings:
  target:
    entity:
      integration: pioneer_async
      domain: media_player
  fields:
    resolution:
      example: "auto"
      selector:
        select:
          translation_key: video_resolution
          options:
            - "auto"
            - "pure"
            - "480_576p"
            - "720p"
            - "1080i"
            - "1080p"
            - "1080_24p"
            - "4k"
            - "4k_24p"
    converter:
      selector:
        boolean:
    pure_cinema:
      example: "auto"
      selector:
        select:
          translation_key: video_pure_cinema
          options:
            - "auto"
            - "on"
            - "off"
    prog_motion:
      example: 0
      selector:
        number:
          min: -4
          max: 4
          step: 1
    stream_smoother:
      example: "off"
      selector:
        select:
          translation_key: video_stream_smoother
          options:
            - "off"
            - "on"
            - "auto"
    advanced_video_adjust:
      example: "PDP"
      selector:
        select:
          translation_key: video_advanced_video_adjust
          options:
            - "pdp"
            - "lcd"
            - "fpj"
            - "professional"
            - "memory"
    ynr:
      example: 0
      selector:
        number:
          min: 0
          max: 8
          step: 1
    cnr:
      example: 0
      selector:
        number:
          min: 0
          max: 8
          step: 1
    bnr:
      example: 0
      selector:
        number:
          min: 0
          max: 8
          step: 1
    mnr:
      example: 0
      selector:
        number:
          min: 0
          max: 8
          step: 1
    detail:
      example: 0
      selector:
        number:
          min: 0
          max: 8
          step: 1
    sharpness:
      example: 0
      selector:
        number:
          min: 0
          max: 8
          step: 1
    brightness:
      example: 0
      selector:
        number:
          min: -6
          max: 6
          step: 1
    contrast:
      example: 0
      selector:
        number:
          min: -6
          max: 6
          step: 1
    hue:
      example: 0
      selector:
        number:
          min: -6
          max: 6
          step: 1
    chroma:
      example: 0
      selector:
        number:
          min: -6
          max: 6
          step: 1
    black_setup:
      selector:
        boolean:
    aspect:
      example: "passthrough"
      selector:
        select:
          translation_key: video_aspect
